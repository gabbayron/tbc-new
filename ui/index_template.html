<!doctype html>
<html lang="" data-i18n-lang>
	<head>
		<title data-class="@@CLASS@@" data-spec="@@SPEC@@"></title>
		<meta charset="utf-8" />

		<link rel="icon" type="image/x-icon" href="/tbc/assets/favicon_io/favicon.ico" />

		<meta name="description" content="" data-class="@@CLASS@@" data-spec="@@SPEC@@" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script>
			try {
				if (localStorage.getItem('__tbc_new_theme') === 'light') document.documentElement.dataset.theme = 'light';
			} catch {}
		</script>

		<link rel="preload" href="/tbc/assets/database/db.json" as="fetch" crossorigin="anonymous" />
		<link rel="stylesheet" href="../../scss/core/individual_sim_ui/index.scss" />

		<script src="./index.ts" type="module"></script>
	</head>

	<body id="bootstrap-overrides">

		<!-- Load wowhead scripts after done loading everything else -->

			const whTooltips = { colorLinks: true };
		</script>
		<script defer src="https://wow.zamimg.com/js/tooltips.js"></script>
		<script type="module">
			import { initLocalization } from '../../i18n/localization.tsx';
			initLocalization();
		</script>
	</body>
</html>
